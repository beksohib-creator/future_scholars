<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Future Scholars</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="brand-title">Future Scholars</div>
      <div class="brand-sub" id="whoami">Yuklanmoqda…</div>
    </div>
    <select id="userPicker" class="picker" hidden aria-label="O'quvchini tanlang"></select>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="view" class="view"></main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <form class="sheet-panel" id="sheetForm" novalidate>
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Yopish">✕</button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
      <div class="sheet-foot">
        <button type="button" class="btn danger" id="sheetDelete" hidden>O'chirish</button>
        <button type="submit" class="btn primary" id="sheetSave">Saqlash</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
